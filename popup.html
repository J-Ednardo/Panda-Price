<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Xianyu Helper BR</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Sans:wght@300;400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: 'DM Sans', sans-serif;
      background: #0d0d0d;
      color: #f0ede6;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #c8392b 0%, #e74c3c 50%, #ff6b35 100%);
      padding: 18px 20px 14px;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '¥→R$';
      position: absolute;
      right: -10px;
      top: -8px;
      font-family: 'Syne', sans-serif;
      font-size: 42px;
      font-weight: 800;
      opacity: 0.15;
      color: white;
      letter-spacing: -2px;
    }

    .header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: white;
    }

    .header p {
      font-size: 11px;
      opacity: 0.75;
      margin-top: 2px;
      color: white;
      font-weight: 300;
    }

    .body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #888;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: #e74c3c;
    }

    .currency-badge {
      padding: 0 12px;
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #e74c3c;
      background: #1e1010;
      height: 42px;
      display: flex;
      align-items: center;
      border-right: 1px solid #2a2a2a;
    }

    input[type="number"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 0 12px;
      height: 42px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: #f0ede6;
    }

    input[type="number"]::placeholder { color: #444; }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

    .rate-hint {
      font-size: 11px;
      color: #555;
      margin-top: 4px;
    }

    .divider {
      height: 1px;
      background: #1e1e1e;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toggle-info h3 {
      font-size: 13px;
      font-weight: 500;
      color: #e0ddd6;
    }

    .toggle-info p {
      font-size: 11px;
      color: #555;
      margin-top: 2px;
    }

    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #2a2a2a;
      border-radius: 22px;
      transition: 0.3s;
    }

    .slider:before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      bottom: 3px;
      background: #666;
      border-radius: 50%;
      transition: 0.3s;
    }

    input:checked + .slider { background: #c8392b; }
    input:checked + .slider:before {
      transform: translateX(18px);
      background: white;
    }

    .save-btn {
      width: 100%;
      height: 42px;
      background: linear-gradient(135deg, #c8392b, #e74c3c);
      border: none;
      border-radius: 8px;
      color: white;
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .save-btn:hover { opacity: 0.88; }
    .save-btn:active { transform: scale(0.98); }

    .status {
      text-align: center;
      font-size: 11px;
      color: #3d9e5a;
      height: 14px;
      transition: opacity 0.3s;
      opacity: 0;
    }

    .status.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Xianyu Helper BR</h1>
    <p>Configurações da extensão</p>
  </div>

  <div class="body">
    <!-- Cotação -->
    <div>
      <div class="field-label">Cotação do Yuan (¥)</div>
      <div class="input-wrapper">
        <span class="currency-badge">1 ¥ =</span>
        <input type="number" id="rate" placeholder="0.00" step="0.01" min="0.01" />
        <span style="padding:0 12px; font-size:13px; color:#888;">R$</span>
      </div>
      <div class="rate-hint" id="rate-hint"></div>
    </div>

    <div class="divider"></div>

    <!-- Toggle conversão -->
    <div class="toggle-row">
      <div class="toggle-info">
        <h3>💱 Converter preços</h3>
        <p>Exibir valores em R$ ao lado de ¥</p>
      </div>
      <label class="toggle">
        <input type="checkbox" id="enableConversion" checked />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Toggle popup -->
    <div class="toggle-row">
      <div class="toggle-info">
        <h3>🚫 Bloquear pop-up de login</h3>
        <p>Remove o aviso de login automático</p>
      </div>
      <label class="toggle">
        <input type="checkbox" id="blockPopup" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="divider"></div>

    <button class="save-btn" id="saveBtn">Salvar configurações</button>
    <div class="status" id="status">✓ Configurações salvas!</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
